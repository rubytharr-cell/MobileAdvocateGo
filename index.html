<style>
  :root { --gold:#decda0; --text:#f3ecda; --muted:#a79f8a; }

  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:linear-gradient(135deg,#080808,#241f16); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:420px; text-align:center; }
  .logo { width:112px; height:112px; border-radius:26px; display:block; margin:0 auto 20px; }
  h1 { margin:0 0 8px; font-size:30px; color:var(--gold); }
  p { margin:0 0 28px; color:var(--muted); line-height:1.4; }
  .btn { display:block; margin:12px 0; padding:15px 18px; border-radius:14px; background:var(--gold);
         color:#111; font-weight:600; font-size:17px; text-decoration:none; }
  .btn.alt { background:transparent; color:var(--gold); border:1.5px solid var(--gold); }
</style>
